# userValidation.properties
#
# File di configurazione per le regole di validazione dei dati dell'utente.
# Contiene i parametri utilizzati per validare i campi come nome, cognome, username e password.
#


# Validazione del campo setFirstName e setLastName
# Il nome e il cognome devono contenere solo lettere (senza numeri o simboli)
# e devono essere lunghi tra 2 e 50 caratteri.
firstAndLastName.minLength=2
firstAndLastName.maxLength=50
firstAndLastName.pattern=^[A-Za-z]{2,50}$

# Validazione del campo setUsername
# Il nome utente deve contenere solo lettere e numeri (no simboli)
# e deve essere lungo tra 2 e 50 caratteri.
username.minLength=2
username.maxLength=50
username.pattern=^[A-Za-z\\d]{2,50}$

# Validazione del campo password
# La password deve contenere almeno una lettera maiuscola,
# una minuscola, un numero, e avere tra 8 e 50 caratteri.
# Simboli NON ammessi in questo pattern base.
password.minLength=8
password.maxLength=50
password.pattern=^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)[A-Za-z\\d]{8,50}$