# exerciseValidation.properties
#
# File di configurazione per le regole di validazione dei dati degli esercizi.
# Contiene i parametri utilizzati per validare i campi come titolo, descrizione,
# testo delle domande e delle risposte.
#


# Validazione per le informazioni generali dell'esercizio (InfoExercise)
infoExercise.title.maxLength=50
infoExercise.description.maxLength=100

# Validazione per il testo di una singola risposta (Answer)
answer.text.maxLength=50

# Validazione per il testo di una singola domanda (Question)
question.text.maxLength=500

# Numero massimo di domande consentite per un esercizio
question.maxNumber=5

# Moltiplicatori per il punteggio in base alla difficoltà
difficulty.easy.multiplier=1
difficulty.intermediate.multiplier=2
difficulty.hard.multiplier=3
