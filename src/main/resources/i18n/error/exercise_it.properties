# exercise_it.properties
#
# File di localizzazione per i messaggi di errore relativi agli esercizi.
# Contiene i messaggi associati ai codici di errore definiti nelle classi ErrorCode
# del package com.play.exceptions.code.exercise.
#

# Sezione: Errori di validazione - Informazioni Esercizio
info.exercise.invalid.title.messageKey=Campo vuoto, inserisci un titolo valido.
