info.exercise.topic.invalid.messageKey=Seleziona un argomento valido.

# Sezione: Errori di validazione - Domanda
question.text.invalid.messageKey=Campo vuoto, inserisci un testo di domanda valido.
question.no.correct.answer.selected.messageKey=Seleziona almeno una risposta corretta per la domanda.

